<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="air-leaflet.css"><style>html,body,#map{height:100%;margin:0}#notice{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:500;background:#151b22e8;color:white;padding:6px 10px;border-radius:4px;font:12px sans-serif;max-width:75%}.plane{font-size:23px;color:#f8c74a;text-shadow:0 1px 3px #111}.leaflet-popup-content{font:13px sans-serif}.leaflet-tile-pane{filter:brightness(.68) saturate(.7)} .leaflet-control-attribution{background:#101820dd!important;color:#a5b2bd!important} .leaflet-control-attribution a{color:#78baff!important} .leaflet-bar a{background:#1b242c!important;color:#dce8f0!important;border-color:#34424d!important}</style></head><body><div id="map"></div><div id="notice">Загрузка данных самолётов…</div><script src="air-leaflet.js"></script><script>
const params=new URLSearchParams(location.search);let lat=Number(params.get('lat')),lon=Number(params.get('lon'));if(!Number.isFinite(lat)||!Number.isFinite(lon)){lat=53.1;lon=91.4}
const map=L.map('map',{zoomControl:true}).setView([lat,lon],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors | Aircraft: <a href="https://www.adsb.lol/" target="_blank">ADSB.lol</a> (ODbL) / <a href="https://adsb.fi/" target="_blank">ADSB.fi</a>'}).addTo(map);map.attributionControl.setPrefix('<a href=https://leafletjs.com/ target=_blank>Leaflet</a>');const layer=L.layerGroup().addTo(map);const notice=document.getElementById('notice');let busy=false;
function txt(v){return v==null||v===''?'—':String(v).trim()}
async function update(){if(busy)return;busy=true;let c=map.getCenter();try{let r=await fetch('/api/aircraft?lat='+c.lat.toFixed(2)+'&lon='+c.lng.toFixed(2));if(!r.ok)throw Error();let d=await r.json();if(!Array.isArray(d.ac))throw Error();layer.clearLayers();let count=0;for(let a of d.ac){if(!Number.isFinite(a.lat)||!Number.isFinite(a.lon))continue;count++;let angle=Number.isFinite(a.track)?a.track:0;let icon=L.divIcon({className:'',html:'<div class="plane" style="transform:rotate('+angle+'deg)">✈</div>',iconSize:[28,28],iconAnchor:[14,14]});let marker=L.marker([a.lat,a.lon],{icon}).addTo(layer);let box=document.createElement('div');for(let line of ['Позывной: '+txt(a.flight),'Борт: '+txt(a.r),'Тип: '+txt(a.t),'Высота: '+(typeof a.alt_baro==='number'?Math.round(a.alt_baro*0.3048)+' м':txt(a.alt_baro)),'Скорость: '+(typeof a.gs==='number'?Math.round(a.gs*1.852)+' км/ч':'—')]){let row=document.createElement('div');row.textContent=line;box.appendChild(row)}marker.bindPopup(box)}notice.textContent=count?'Самолётов в районе: '+count:'Нет данных о самолётах в этом районе. Покрытие сетей может быть ограничено.';if(Array.isArray(d.unavailable)&&d.unavailable.length)notice.textContent+=' · Недоступен источник: '+d.unavailable.join(', ');}catch(e){notice.textContent='Данные самолётов временно недоступны. Повторяем запрос.'}finally{busy=false}}
let timer;map.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(update,700)});update();setInterval(update,30000);
</script></body></html>
